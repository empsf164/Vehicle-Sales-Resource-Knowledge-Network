<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Network — DRIVEFORGE Knowledge Network</title>
  <meta name="description"
    content="Create your DRIVEFORGE account to gain full access to automotive sales playbooks, video masterclasses, and field toolkits.">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f57c00'/><path d='M30 25 L70 50 L30 75 Z' fill='%23ffffff'/></svg>">
</head>

<body class="auth-page-wrapper">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- TOP-RIGHT THEME TOGGLE BUTTON -->
  <div class="auth-fixed-theme-btn">
    <button class="btn btn-icon theme-toggle-btn shadow-sm" type="button" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <!-- CENTERED AUTH CARD -->
  <main id="main-content" class="w-100 d-flex justify-content-center">
    <div class="auth-card-centered">
      
      <!-- BRAND LOGO IN TOP CENTER INSIDE BOX -->
      <div class="auth-brand-header">
        <a class="auth-brand-logo" href="index.html">
          <span class="logo-badge"><i class="bi bi-shield-shaded"></i></span>
          <span>DRIVE<span class="text-warning">FORGE</span></span>
        </a>
        <h1 class="h3 fw-bold mb-1">Create Account</h1>
        <p class="text-muted small mb-0">Join thousands of vehicle sales professionals.</p>
      </div>

      <!-- Feedback Alert -->
      <div id="signupFeedbackAlert" style="display: none;" class="mb-3"></div>

      <form id="signupForm">
        <!-- EACH INPUT FIELD IN A SEPARATE LINE -->
        <div class="mb-3">
          <label for="signupName" class="form-label-custom">Full Name *</label>
          <input type="text" class="form-control form-control-custom" id="signupName" placeholder="e.g. Jordan Taylor" required>
        </div>

        <div class="mb-3">
          <label for="signupRole" class="form-label-custom">Your Primary Role *</label>
          <select class="form-select form-control-custom" id="signupRole" required>
            <option value="Sales Consultant" selected>Sales Consultant</option>
            <option value="Sales Manager">Sales Manager</option>
            <option value="BDC Representative">BDC Representative</option>
            <option value="Sales Trainer">Sales Trainer</option>
            <option value="Automotive Professional">Automotive Professional</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="signupEmail" class="form-label-custom">Work or Personal Email *</label>
          <input type="email" class="form-control form-control-custom" id="signupEmail" placeholder="e.g. jordan@dealership.com" required>
        </div>

        <div class="mb-3">
          <label for="signupPassword" class="form-label-custom">Password *</label>
          <div class="password-input-wrap">
            <input type="password" class="form-control form-control-custom" id="signupPassword" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label for="signupPasswordConfirm" class="form-label-custom">Confirm Password *</label>
          <div class="password-input-wrap">
            <input type="password" class="form-control form-control-custom" id="signupPasswordConfirm" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
          <label class="form-check-label text-muted small" for="termsCheck">
            I agree to the <a href="about.html#guidelines" class="text-warning text-decoration-none">Community Guidelines</a> and Platform Terms.
          </label>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-4">
          <i class="bi bi-person-plus-fill me-1"></i> Create Free Account
        </button>

        <!-- SOCIAL ICONS GOOGLE & APPLE AT BOTTOM -->
        <div class="d-flex align-items-center mb-3">
          <hr class="flex-grow-1 border-subtle my-0">
          <span class="px-3 text-muted small fw-medium">Or continue with</span>
          <hr class="flex-grow-1 border-subtle my-0">
        </div>

        <div class="row g-2 mb-4">
          <div class="col-6">
            <button type="button" class="auth-social-btn" onclick="showToast('Google Sign-in demo triggered', 'bi-google')">
              <i class="bi bi-google text-danger fs-5"></i>
              <span>Google</span>
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="auth-social-btn" onclick="showToast('Apple Sign-in demo triggered', 'bi-apple')">
              <i class="bi bi-apple fs-5"></i>
              <span>Apple</span>
            </button>
          </div>
        </div>
      </form>

      <div class="text-center pt-3 border-top border-subtle text-muted small">
        Already have an account?
        <a href="login.html" class="text-warning fw-bold ms-1 text-decoration-none">Sign In</a>
      </div>
    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
