<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DRIVEFORGE Knowledge Network</title>
  <meta name="description"
    content="Sign in to your DRIVEFORGE account to save resources, join community discussions, and track your sales curriculum progress.">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f57c00'/><path d='M30 25 L70 50 L30 75 Z' fill='%23ffffff'/></svg>">
</head>

<body class="auth-page-wrapper">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- TOP-RIGHT THEME TOGGLE BUTTON -->
  <div class="auth-fixed-theme-btn">
    <button class="btn btn-icon theme-toggle-btn shadow-sm" type="button" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <!-- CENTERED AUTH CARD -->
  <main id="main-content" class="w-100 d-flex justify-content-center">
    <div class="auth-card-centered">
      
      <!-- BRAND LOGO IN TOP CENTER INSIDE BOX -->
      <div class="auth-brand-header">
        <a class="auth-brand-logo" href="index.html">
          <span class="logo-badge"><i class="bi bi-shield-shaded"></i></span>
          <span>DRIVE<span class="text-warning">FORGE</span></span>
        </a>
        <h1 class="h3 fw-bold mb-1">Welcome Back</h1>
        <p class="text-muted small mb-0">Enter your credentials to access your account.</p>
      </div>

      <!-- Feedback Alert -->
      <div id="loginFeedbackAlert" style="display: none;" class="mb-3"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label-custom">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-tertiary border-medium"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" class="form-control form-control-custom" id="loginEmail"
              placeholder="e.g. consultant@dealership.com" value="consultant@driveforge.demo" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="loginPassword" class="form-label-custom">Password</label>
          <div class="password-input-wrap">
            <input type="password" class="form-control form-control-custom" id="loginPassword"
              placeholder="••••••••" value="salespro2026" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- REMEMBER ME AND FORGOT PASSWORD ON SAME LINE -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label text-muted small" for="rememberMe">
              Remember me
            </label>
          </div>
          <a href="forgot-password.html" class="small text-warning fw-semibold text-decoration-none">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-4">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to DRIVEFORGE
        </button>

        <!-- SOCIAL ICONS GOOGLE & APPLE AT BOTTOM -->
        <div class="d-flex align-items-center mb-3">
          <hr class="flex-grow-1 border-subtle my-0">
          <span class="px-3 text-muted small fw-medium">Or continue with</span>
          <hr class="flex-grow-1 border-subtle my-0">
        </div>

        <div class="row g-2 mb-4">
          <div class="col-6">
            <button type="button" class="auth-social-btn" onclick="showToast('Google Sign-in demo triggered', 'bi-google')">
              <i class="bi bi-google text-danger fs-5"></i>
              <span>Google</span>
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="auth-social-btn" onclick="showToast('Apple Sign-in demo triggered', 'bi-apple')">
              <i class="bi bi-apple fs-5"></i>
              <span>Apple</span>
            </button>
          </div>
        </div>
      </form>

      <div class="text-center pt-3 border-top border-subtle text-muted small">
        Don't have an account yet?
        <a href="signup.html" class="text-warning fw-bold ms-1 text-decoration-none">Join the Network</a>
      </div>
    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
