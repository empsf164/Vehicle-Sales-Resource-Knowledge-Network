<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — DRIVEFORGE Knowledge Network</title>
  <meta name="description" content="Request a password reset link for your DRIVEFORGE automotive sales professional account.">
  
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f57c00'/><path d='M30 25 L70 50 L30 75 Z' fill='%23ffffff'/></svg>">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- TOP MINIMAL NAV -->
  <header class="py-3 border-bottom border-subtle" style="background: var(--bg-secondary);">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand navbar-brand-logo mb-0" href="index.html">
        <span class="logo-badge"><i class="bi bi-shield-shaded"></i></span>
        <span>DRIVE<span class="text-warning">FORGE</span></span>
      </a>

      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-icon theme-toggle-btn" type="button" aria-label="Toggle Theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="login.html" class="btn btn-ghost-custom small">
          <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
      </div>
    </div>
  </header>

  <!-- CENTERED CARD -->
  <main id="main-content" class="my-auto py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card p-4 p-md-5 border-medium shadow-lg" style="background: var(--bg-card); border-radius: var(--radius-lg);">
            <div class="text-center mb-4">
              <div class="doc-icon-wrap mx-auto mb-3" style="background: var(--accent-amber-soft); color: var(--accent-amber); width: 56px; height: 56px; font-size: 1.5rem;">
                <i class="bi bi-key-fill"></i>
              </div>
              <h1 class="h3 fw-bold mb-2">Reset Password</h1>
              <p class="text-muted small mb-0">
                Enter your registered email address and we will generate a secure reset link.
              </p>
            </div>

            <!-- Feedback Alert -->
            <div id="resetFeedbackAlert" style="display: none;" class="mb-3"></div>

            <form id="forgotPasswordForm">
              <div class="mb-4">
                <label for="resetEmail" class="form-label-custom">Account Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-tertiary border-medium"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control form-control-custom" id="resetEmail" placeholder="e.g. consultant@dealership.com" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3">
                <i class="bi bi-send-fill me-1"></i> Send Reset Link
              </button>
            </form>

            <div class="text-center pt-3 border-top border-subtle text-muted small">
              Remembered your credentials? 
              <a href="login.html" class="text-warning fw-bold ms-1">Return to Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center border-top border-subtle text-muted small">
    © 2026 DRIVEFORGE. Demonstration brand. <a href="index.html" class="text-reset ms-2">Home</a>
  </footer>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
