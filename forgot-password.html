<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — DRIVEFORGE Knowledge Network</title>
  <meta name="description" content="Request a password reset link for your DRIVEFORGE automotive sales professional account.">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f57c00'/><path d='M30 25 L70 50 L30 75 Z' fill='%23ffffff'/></svg>">
</head>

<body class="auth-page-wrapper">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- TOP-RIGHT THEME TOGGLE BUTTON -->
  <div class="auth-fixed-theme-btn">
    <button class="btn btn-icon theme-toggle-btn shadow-sm" type="button" aria-label="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <!-- CENTERED AUTH CARD -->
  <main id="main-content" class="w-100 d-flex justify-content-center">
    <div class="auth-card-centered">
      
      <!-- BRAND LOGO IN TOP CENTER INSIDE BOX -->
      <div class="auth-brand-header">
        <a class="auth-brand-logo" href="index.html">
          <span class="logo-badge"><i class="bi bi-shield-shaded"></i></span>
          <span>DRIVE<span class="text-warning">FORGE</span></span>
        </a>
        <h1 class="h3 fw-bold mb-1">Reset Password</h1>
        <p class="text-muted small mb-0">Enter your registered email address to receive a secure reset link.</p>
      </div>

      <!-- Feedback Alert -->
      <div id="resetFeedbackAlert" style="display: none;" class="mb-3"></div>

      <form id="forgotPasswordForm">
        <div class="mb-4">
          <label for="resetEmail" class="form-label-custom">Account Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-tertiary border-medium"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" class="form-control form-control-custom" id="resetEmail"
              placeholder="e.g. consultant@dealership.com" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-4">
          <i class="bi bi-send-fill me-1"></i> Send Reset Link
        </button>

        <!-- SOCIAL ICONS GOOGLE & APPLE AT BOTTOM -->
        <div class="d-flex align-items-center mb-3">
          <hr class="flex-grow-1 border-subtle my-0">
          <span class="px-3 text-muted small fw-medium">Or continue with</span>
          <hr class="flex-grow-1 border-subtle my-0">
        </div>

        <div class="row g-2 mb-4">
          <div class="col-6">
            <button type="button" class="auth-social-btn" onclick="showToast('Google Sign-in demo triggered', 'bi-google')">
              <i class="bi bi-google text-danger fs-5"></i>
              <span>Google</span>
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="auth-social-btn" onclick="showToast('Apple Sign-in demo triggered', 'bi-apple')">
              <i class="bi bi-apple fs-5"></i>
              <span>Apple</span>
            </button>
          </div>
        </div>
      </form>

      <div class="text-center pt-3 border-top border-subtle text-muted small">
        Remembered your credentials?
        <a href="login.html" class="text-warning fw-bold ms-1 text-decoration-none">Return to Login</a>
      </div>
    </div>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
